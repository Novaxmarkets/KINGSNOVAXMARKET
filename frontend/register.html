<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - NovaxMarkets</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

    <h1>Create Your Account</h1>
    <p>Join NovaxMarkets and start trading digital options.</p>

    <form id="registerForm">
        <div class="message-box" id="authMessage" hidden></div>
        <input type="text" id="registerFullName" placeholder="Full Name" required>
        <input type="email" id="registerEmail" placeholder="Email Address" required>
        <input type="password" id="registerPassword" placeholder="Password" required>
        <input type="password" id="registerConfirmPassword" placeholder="Confirm Password" required>
        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script src="script.js"></script>
</body>
</html>
